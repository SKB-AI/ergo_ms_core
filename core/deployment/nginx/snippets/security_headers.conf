# HTTP security headers для SPA, static и proxy (add_header ... always).
# Режим CSP задаётся API_CSP_MODE / профилем; при render подставляется блок из csp_policy.
# Этот файл — эталон as_is (совпадает с build_security_headers_nginx('as_is')).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
# Яндекс.Карты + OSM/MapLibre: домены тайлов; unsafe-eval — требование JS API Яндекса (режим as_is).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net https://suggest-maps.yandex.ru; style-src 'self' 'unsafe-inline' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://suggest-maps.yandex.ru https://yastatic.net https://tile.openstreetmap.org https://*.tile.openstreetmap.org; worker-src 'self' blob: data: https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; child-src blob: https://api-maps.yandex.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
