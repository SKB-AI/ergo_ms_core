# ERGO MS — dev-override (Vite, bind-mount исходников)
services:
  api:
    # Публичный API на хост. /internal/bridge закрыт nginx deny и проверкой адреса.
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"

  # media-api: порт на хост не публикуем (/internal не должен быть снаружи).
  # В docker-dev доступ с хоста — через nginx profile или docker network.

  client:
    image: ${DOCKER_NODE_IMAGE:-ergo_ms-client:local}
    build:
      context: ../../..
      dockerfile: core/deployment/docker/Dockerfile.client
      args:
        NODE_BASE: ${DOCKER_NODE_BASE:-node:20-bookworm-slim}
    env_file:
      - .compose.env
    environment:
      ERGO_DOCKER_SERVICE_NAME: client
      ERGO_DOCKER_REQUIRES_SETUP: "1"
    working_dir: /app
    volumes:
      - ${ERGO_PROJECT_ROOT:-../../..}:/app
      - node_modules:/app/virtual_env/npm/node_modules
      - npm_cache:/root/.npm
    ports:
      - "${CLIENT_PORT:-8001}:${CLIENT_PORT:-8001}"
    networks:
      - ergo_net
    command: >
      sh -c "/usr/local/bin/ergo-wait-docker-setup.sh
      && mkdir -p /app/logs/docker
      && exec >>/app/logs/docker/client.log 2>&1
      && /usr/local/bin/ergo-ensure-npm-deps.sh
      && cd /app/virtual_env/npm
      && export PATH=\"/app/virtual_env/npm/node_modules/.bin:$${PATH}\"
      && npm run dev -w @ergo-ms/core-client -- --host 0.0.0.0 --port ${CLIENT_PORT:-8001}"
    restart: unless-stopped

volumes:
  node_modules:
    name: ${DOCKER_COMPOSE_PROJECT:-ergo_ms}_node_modules
  npm_cache:
    name: ${DOCKER_COMPOSE_PROJECT:-ergo_ms}_npm_cache
