# ERGO MS — nginx в Docker (profile: nginx)
# Upstream — имена сервисов compose, не 127.0.0.1

services:
  nginx:
    image: ${DOCKER_NGINX_IMAGE:-nginx:1.27-alpine}
    profiles: ["nginx"]
    ports:
      - "${NGINX_LISTEN_PORT:-80}:${NGINX_LISTEN_PORT:-80}"
    volumes:
      - ./nginx/ergo_ms.conf.rendered:/etc/nginx/conf.d/default.conf:ro
      - ${ERGO_PROJECT_ROOT:-../../..}/core/client/dist:/usr/share/nginx/html:ro
      - ${ERGO_PROJECT_ROOT:-../../..}/virtual_env/static_api:/usr/share/nginx/static:ro
      - ${ERGO_LOGS_BIND:-../../../logs}:/var/log/ergo:rw
    depends_on:
      api:
        condition: service_started
        required: false
      media-api:
        condition: service_started
        required: false
    networks:
      - ergo_net
    restart: unless-stopped

  api:
    ports: []

  media-api:
    ports: []

  client:
    ports: []
