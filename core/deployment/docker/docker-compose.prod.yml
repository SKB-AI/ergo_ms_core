# ERGO MS — prod-override (daphne, сборка клиента)
services:
  api:
    ports: []

  media-api:
    ports: []

  client-build:
    image: ${DOCKER_NODE_IMAGE:-ergo_ms-client:local}
    build:
      context: ../../..
      dockerfile: core/deployment/docker/Dockerfile.client
      args:
        NODE_BASE: ${DOCKER_NODE_BASE:-node:20-bookworm-slim}
    env_file:
      - .compose.env
    environment:
      ERGO_DOCKER_SERVICE_NAME: client-build
      ERGO_DOCKER_REQUIRES_SETUP: "1"
    working_dir: /app
    volumes:
      - ${ERGO_PROJECT_ROOT:-../../..}:/app
      - client_dist:/app/core/client/dist
      - node_modules:/app/virtual_env/npm/node_modules
      - npm_cache:/root/.npm
    networks:
      - ergo_net
    command: >
      sh -c "/usr/local/bin/ergo-wait-docker-setup.sh
      && mkdir -p /app/logs/docker
      && exec >>/app/logs/docker/client-build.log 2>&1
      && /usr/local/bin/ergo-ensure-npm-deps.sh
      && cd /app/virtual_env/npm
      && npm run build -w @ergo-ms/core-client"
    restart: "no"

volumes:
  client_dist:
    name: ${DOCKER_COMPOSE_PROJECT:-ergo_ms}_client_dist
  node_modules:
    name: ${DOCKER_COMPOSE_PROJECT:-ergo_ms}_node_modules
  npm_cache:
    name: ${DOCKER_COMPOSE_PROJECT:-ergo_ms}_npm_cache
