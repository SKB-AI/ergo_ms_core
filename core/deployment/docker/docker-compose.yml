# ERGO MS — базовый Docker Compose
# Запуск: ergoms docker-up

name: ${DOCKER_COMPOSE_PROJECT:-ergo_ms}

x-python-volumes: &python_volumes
  - ${ERGO_PROJECT_ROOT:-../../..}:/app
  - ./.compose.databases.yaml:/app/databases.yaml:ro
  - ${ERGO_LOGS_BIND:-../../../logs}:/app/logs
  - ${ERGO_MEDIA_BIND:-../../../media}:/app/media
  - ${ERGO_CELERY_CACHE_BIND:-celery_cache}:/app/virtual_env/cache
  - poetry_venv:/app/virtual_env/python

services:
  redis:
    image: ${DOCKER_REDIS_IMAGE:-redis:7-alpine}
    # Публикация на хост — docker-compose.publish.generated.yml
    # (только при явном DOCKER_REDIS_PUBLISH_PORT).
    # AUTH — docker-compose.redis-auth.generated.yml при непустом
    # databases.yaml redis.password.
    networks:
      - ergo_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["host-api"]
    image: ${DOCKER_PYTHON_IMAGE:-ergo_ms-python:local}
    build:
      context: ../../..
      dockerfile: core/deployment/docker/Dockerfile.python
      args:
        ERGO_DOCKER_DEPS_CACHE: ${DOCKER_DEPS_CACHE:-internal}
        PYTHON_BASE: ${DOCKER_PYTHON_BASE:-python:3.12-slim-bookworm}
    env_file:
      - .compose.env
    environment:
      ERGO_DOCKER_SERVICE_NAME: api
      ERGO_DOCKER_REQUIRES_SETUP: "0"
      ERGO_PROCESS_ROLE: api
    volumes: *python_volumes
    # Публичный API. Служебный /internal/bridge nginx режет (deny all);
    # сам процесс принимает мост только с loopback (монолит)
    # или private/link-local (microservice|split).
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ergo_net
    command: ["python", "core/api/scripts/start_api.py"]
    restart: unless-stopped

  media-api:
    profiles: ["host-media"]
    image: ${DOCKER_PYTHON_IMAGE:-ergo_ms-python:local}
    env_file:
      - .compose.env
    environment:
      ERGO_DOCKER_SERVICE_NAME: media-api
      ERGO_DOCKER_REQUIRES_SETUP: "1"
    volumes: *python_volumes
    # Порт на хост не публикуем: /internal/* не должен быть снаружи.
    # Публичный доступ — через nginx (profile) или docker-сеть.
    expose:
      - "${MEDIA_API_BIND_PORT:-8003}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ergo_net
    command: ["python", "core/api/scripts/start_media_api.py"]
    restart: unless-stopped

  celery-beat:
    profiles: ["host-beat"]
    image: ${DOCKER_PYTHON_IMAGE:-ergo_ms-python:local}
    env_file:
      - .compose.env
    environment:
      ERGO_DOCKER_SERVICE_NAME: celery-beat
      ERGO_DOCKER_REQUIRES_SETUP: "1"
    volumes: *python_volumes
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - ergo_net
    command: ["python", "core/api/scripts/start_celery_beat.py"]
    restart: unless-stopped

networks:
  ergo_net:
    driver: bridge

volumes:
  celery_cache:
    name: ${DOCKER_COMPOSE_PROJECT:-ergo_ms}_celery_cache
  poetry_venv:
    name: ${DOCKER_COMPOSE_PROJECT:-ergo_ms}_poetry_venv
