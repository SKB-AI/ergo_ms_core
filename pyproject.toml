[tool.poetry]
name = "ergo_ms_api"
version = "3.0.0"
description = "Ergo MS API"
authors = ["Eugene Sergeevich Muzalevsky <muzalevskij.evgenij@mail.ru>"]
packages = [
    {include = "src", from = "core/api"},
    {include = "media_server", from = "core/media_api/src"},
    {include = "modules", from = ""},
    {include = "commands", from = "core/api"},
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
django = ">=5.2.8,<5.3"
djangorestframework = ">=3.17.2,<3.18"
django-cors-headers = ">=4.7.0"
djangorestframework-simplejwt = ">=5.5.0"
drf-spectacular = ">=0.28.0,<0.29"
pandas = ">=2.3.1"
numpy = ">=2.1.3"
setuptools = ">=80.9.0"
wheel = ">=0.45.1"
daphne = ">=4.2.1"
whitenoise = ">=6.9.0"
psutil = ">=7.0.0"
django-environ = ">=0.12.0"
pyyaml = ">=6.0.2"
sqlalchemy = ">=2.0.41"
sshtunnel = ">=0.4.0"
pyodbc = ">=5.2.0"
mysql-connector-python = ">=9.3.0"
celery = {version = ">=5.5.3", extras = ["sqlalchemy"]}
django-celery-beat = ">=2.8.1"
channels = ">=4.2.2"
channels-redis = ">=4.2.1"
channels-postgres = ">=1.0.5"
django-extensions = ">=4.1,<5.0"
django-filter = ">=25.1"
requests = ">=2.31.0,<3.0.0"
sqlparse = ">=0.6.0,<0.7.0"
cryptography = "^50.0.0"
psycopg2-binary = "^2.9.11"
pillow = "^12.1.1"
geoip2 = ">=4.8.0,<5.0.0"
httpx = ">=0.27.0,<1.0.0"
meilisearch = ">=0.40.0,<0.42"
filetype = ">=1.2.0,<2.0.0"

[tool.poetry.group.jupyter]
optional = true

[tool.poetry.group.jupyter.dependencies]
ipykernel = ">=6.29.5"
notebook = ">=7.4.4,<8.0.0"
jupyterlab = ">=4.4.5,<5.0.0"

[tool.poetry.group.mcp]
optional = true

[tool.poetry.group.mcp.dependencies]
mcp = "^1.20.0"

[tool.poetry.group.loadtest]
optional = true

[tool.poetry.group.loadtest.dependencies]
locust = ">=2.32.0,<3.0.0"

[tool.poetry.scripts]
api = "commands.__main__:main"
media_api = "media_server.manage:main"

[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"
